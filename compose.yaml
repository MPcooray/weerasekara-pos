services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tetrova_pos
      POSTGRES_USER: tetrova
      POSTGRES_PASSWORD: tetrova
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetrova -d tetrova_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres_data:

