services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m
    cpus: 0.75
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file: ["${PRODUCTION_ENV_FILE:-.env.production}"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
      RUN_MIGRATIONS: "true"
      MIGRATION_ONLY: "true"
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ["${PRODUCTION_ENV_FILE:-.env.production}"]
    environment:
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
      RUN_MIGRATIONS: "false"
    expose: ["8000"]
    networks: [backend, edge]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    expose: ["80"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    cpus: 0.25
    logging: *logging

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?Set BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backup_cache:/backups
    networks: [backend, edge]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_cache:
