name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tetrova_test
          POSTGRES_USER: tetrova
          POSTGRES_PASSWORD: tetrova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tetrova -d tetrova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check apps/api
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: pytest apps/api/tests
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: postgresql+psycopg://tetrova:tetrova@localhost:5432/tetrova_test
          INITIAL_ADMIN_PASSWORD: ""
